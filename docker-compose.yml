services:
  api:
    build: ./api
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite:///./data/ledger.db
      DEMO_MODE: ${DEMO_MODE:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
  web:
    ports: ["5173:80"]
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on: [api]
